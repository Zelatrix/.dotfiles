# format="$username@$hostname $directory( $git_branch)( $python)\\$ " 
format="$directory($git_branch)❱ "
 
[username]
disabled=false
show_always=true
style_user="green"
format="[$user]($style)"

[hostname]
disabled=false
ssh_only=false
style="green"
format="[$hostname]($style)"

[directory]
disabled=false
style="bold bright-green"

[git_branch]
style="bold bright-yellow"
symbol=" "
